<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyección - Biblia Sincronizada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #111;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .proyeccion {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5vh 7vw;
      position: relative;
    }
    .reference {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 900;
      width: 100%;
      text-align: center;
      font-size: clamp(30px, 4.2vw, 54px);
      margin-bottom: 4vh;
      color: #173f35;
    }
    .text {
      width: 100%;
      max-height: 76vh;
      overflow-y: auto;
      padding: 0 2vw;
      font-size: clamp(36px, 5vw, 74px);
      font-weight: 700;
      line-height: 1.5;
      text-align: left;
      color: #111;
      scrollbar-width: thin;
    }
    .text::-webkit-scrollbar { width: 8px; }
    .text::-webkit-scrollbar-thumb { background: #bbb; border-radius: 8px; }
    .version {
      width: 100%;
      text-align: center;
      margin-top: 4vh;
      font-size: clamp(18px, 2vw, 26px);
      color: #666;
    }
    .waiting { text-align: center; color: #777; }
    .fullscreen-button {
      position: fixed; right: 18px; bottom: 18px;
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.15); color: #333; cursor: pointer;
      font-size: 20px; opacity: 0.35; transition: opacity 0.2s;
    }
    .fullscreen-button:hover { opacity: 1; }
    #partBadge {
      position: fixed; right: 74px; bottom: 18px;
      padding: 9px 16px; border-radius: 22px;
      background: #173f35; color: #fff;
      font-family: Arial, sans-serif; font-size: 15px; font-weight: bold;
      display: none; cursor: pointer; opacity: 0.9;
    }
    .status {
      position: fixed; left: 15px; bottom: 15px;
      padding: 6px 10px; border-radius: 20px;
      background: #ddd; color: #555; font-size: 12px; opacity: 0.45;
    }
    .status.connected { background: #dcece5; color: #173f35; }
    mark { background-color: #ffff00; }
    @media (max-width: 600px) {
      .proyeccion { padding: 4vh 5vw; }
      .reference { margin-bottom: 3vh; }
      .text { padding: 0 1vw; }
    }
  </style>
</head>
<body>
  <main id="main" class="proyeccion">
    <div id="reference" class="reference">Biblia Sincronizada</div>
    <div id="text" class="text waiting">Esperando que el predicador proyecte un versículo...</div>
    <div id="version" class="version"></div>
  </main>
  <button id="fullscreenButton" class="fullscreen-button" title="Pantalla completa">⛶</button>
  <div id="partBadge">Parte 1 ▶</div>
  <div id="status" class="status">Conectando...</div>
  <script>
    const reference = document.getElementById("reference");
    const text = document.getElementById("text");
    const version = document.getElementById("version");
    const status = document.getElementById("status");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const partBadge = document.getElementById("partBadge");
    const main = document.getElementById("main");

    let ws;
    let ultimoData = null;
    let divisiones = [];
    let totalPartes = 1;
    let parteActual = 0;

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function palabrasAHtml(palabras, desde, hasta) {
      let html = "", enMark = false;
      for (let i = desde; i < hasta; i++) {
        const w = palabras[i];
        if (w.h && !enMark) { html += "<mark>"; enMark = true; }
        if (!w.h && enMark) { html += "</mark>"; enMark = false; }
        html += escapeHtml(w.t);
        if (i < hasta - 1) html += " ";
      }
      if (enMark) html += "</mark>";
      return html;
    }

    // --- Corte automático real: divide en N partes midiendo la pantalla ---
    function parteEntra(words, r) {
      text.innerHTML = palabrasAHtml(words, r[0], r[1]);
      return text.scrollHeight <= text.clientHeight + 2;
    }

    function cortarEnN(words, N) {
      const total = words.reduce((a, w) => a + w.t.length + 1, 0);
      const objetivo = total / N;
      const cortes = [];
      let acc = 0, nextCut = 1;
      for (let i = 0; i < words.length && cortes.length < N - 1; i++) {
        acc += words[i].t.length + 1;
        if (acc >= objetivo && i < words.length - 1) {
          let mejor = i;
          const ventana = Math.max(2, Math.floor(words.length * 0.05));
          for (let d = 0; d <= ventana; d++) {
            const izq = i - d, der = i + d;
            if (izq > nextCut && izq < words.length - 1 && /[.,;:?!]$/.test(words[izq-1].t)) { mejor = izq; break; }
            if (der < words.length - 1 && der > nextCut && /[.,;:?!]$/.test(words[der-1].t)) { mejor = der; break; }
          }
          cortes.push(mejor);
          nextCut = mejor + 1;
          acc = 0;
        }
      }
      const rangos = [];
      let desde = 0;
      cortes.forEach(c => { rangos.push([desde, c]); desde = c; });
      rangos.push([desde, words.length]);
      return rangos;
    }

    function medirYDividir(words) {
      text.className = "text";
      if (parteEntra(words, [0, words.length])) return [[0, words.length]];
      let ultimo = null;
      for (let N = 2; N <= 8; N++) {
        const rangos = cortarEnN(words, N);
        const ok = rangos.every(r => parteEntra(words, r));
        if (ok) return rangos;
        ultimo = rangos;
      }
      return ultimo; // texto gigante: quedará con scroll mínimo
    }

    function mostrarVerse(data) {
      ultimoData = data;
      reference.textContent = `${data.bookName} ${data.chapter}:${data.verse}`;
      version.textContent = data.version || "";
      text.className = "text";

      divisiones = medirYDividir(data.words || []);
      totalPartes = divisiones.length;
      parteActual = Math.min(Math.max(0, data.part || 0), totalPartes - 1);

      const r = divisiones[parteActual];
      text.innerHTML = palabrasAHtml(data.words, r[0], r[1]);
      text.scrollTop = 0;
      actualizarBadge();
      avisarPartes();
    }

    function mostrarFree(data) {
      ultimoData = null;
      totalPartes = 1; parteActual = 0;
      reference.textContent = "Cita";
      text.className = "text";
      text.innerHTML = data.html || "";
      version.textContent = "";
      text.scrollTop = 0;
      actualizarBadge();
    }

    function mostrarProyeccion(data) {
      if (!data) return;
      if (data.type === "verse") mostrarVerse(data);
      else if (data.type === "freeText") mostrarFree(data);
    }

    function irAParte(n) {
      if (!ultimoData || n < 0 || n >= totalPartes) return;
      parteActual = n;
      const r = divisiones[n];
      text.innerHTML = palabrasAHtml(ultimoData.words, r[0], r[1]);
      text.scrollTop = 0;
      actualizarBadge();
      avisarPartes();
    }

    function actualizarBadge() {
      if (totalPartes > 1) {
        partBadge.style.display = "block";
        partBadge.textContent = "Parte " + (parteActual + 1) + " de " + totalPartes +
          (parteActual + 1 < totalPartes ? "  ▶" : "");
      } else partBadge.style.display = "none";
    }

    function avisarPartes() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !ultimoData) return;
      ws.send(JSON.stringify({
        type: "project",
        reference: "",
        data: {
          type: "parts-info",
          count: totalPartes,
          current: parteActual + 1,
          ranges: divisiones,
          verse: ultimoData.verse,
          chapter: ultimoData.chapter
        }
      }));
    }

    main.addEventListener("click", () => irAParte((parteActual + 1) % totalPartes));
    partBadge.addEventListener("click", (e) => { e.stopPropagation(); irAParte((parteActual + 1) % totalPartes); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); irAParte((parteActual + 1) % totalPartes); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); irAParte((parteActual - 1 + totalPartes) % totalPartes); }
    });

    function conectar() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}`);
      ws.addEventListener("open", () => {
        status.textContent = "Conectado · v9";
        status.classList.add("connected");
      });
      ws.addEventListener("close", () => {
        status.textContent = "Desconectado";
        status.classList.remove("connected");
        setTimeout(conectar, 2000);
      });
      ws.addEventListener("error", () => { status.textContent = "Error de conexión"; status.classList.remove("connected"); });
      ws.addEventListener("message", (event) => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === "projection") mostrarProyeccion(message.data);
        } catch (error) { console.error(error); }
      });
    }

    async function pantallaCompleta() {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (error) { console.error(error); }
    }

    fullscreenButton.addEventListener("click", pantallaCompleta);
    conectar();
  </script>
</body>
</html>
