<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyección - Biblia Sincronizada</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #ffffff;
      color: #111;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .proyeccion {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5vh 7vw;
      position: relative;
    }
    .reference {
      width: 100%;
      text-align: center;
      font-size: clamp(32px, 4.5vw, 56px);
      font-weight: bold;
      margin-bottom: 4vh;
      color: #173f35;
    }
    .text {
      width: 100%;
      max-height: 76vh;
      overflow-y: auto;
      padding: 0 2vw;
      font-size: clamp(36px, 5vw, 74px);
      font-weight: 700;
      line-height: 1.5;
      text-align: left;
      color: #111;
      scrollbar-width: thin;
    }
    .text.quote { text-align: justify; }
    .text::-webkit-scrollbar { width: 8px; }
    .text::-webkit-scrollbar-thumb { background: #bbb; border-radius: 8px; }
    .version {
      width: 100%;
      text-align: center;
      margin-top: 4vh;
      font-size: clamp(18px, 2vw, 26px);
      color: #666;
    }
    .waiting { text-align: center; color: #777; }
    .fullscreen-button {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
      color: #333;
      cursor: pointer;
      font-size: 20px;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    .fullscreen-button:hover { opacity: 1; }
    .status {
      position: fixed;
      left: 15px;
      bottom: 15px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #ddd;
      color: #555;
      font-size: 12px;
      opacity: 0.45;
      font-family: Arial, sans-serif;
    }
    .status.connected { background: #dcece5; color: #173f35; }
    mark, .resaltado { background-color: #ffff00; }
    @media (max-width: 600px) {
      .proyeccion { padding: 4vh 5vw; }
      .reference { margin-bottom: 3vh; }
      .text { padding: 0 1vw; }
    }
  </style>
</head>
<body>
  <main class="proyeccion">
    <div id="reference" class="reference">Biblia Sincronizada</div>
    <div id="text" class="text waiting">Esperando que el predicador proyecte un versículo...</div>
    <div id="version" class="version"></div>
  </main>
  <button id="fullscreenButton" class="fullscreen-button" title="Pantalla completa">⛶</button>
  <div id="status" class="status">Conectando...</div>
  <script>
    const reference = document.getElementById("reference");
    const text = document.getElementById("text");
    const version = document.getElementById("version");
    const status = document.getElementById("status");
    const fullscreenButton = document.getElementById("fullscreenButton");
    let ws;

    function conectar() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsBase = location.pathname.startsWith("/biblia") ? "/biblia" : "";
      ws = new WebSocket(`${protocol}//${location.host}${wsBase}`);
      ws.addEventListener("open", () => {
        status.textContent = "Conectado";
        status.classList.add("connected");
      });
      ws.addEventListener("close", () => {
        status.textContent = "Desconectado";
        status.classList.remove("connected");
        setTimeout(conectar, 2000);
      });
      ws.addEventListener("error", () => {
        status.textContent = "Error de conexión";
        status.classList.remove("connected");
      });
      ws.addEventListener("message", event => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === "projection") mostrarProyeccion(message.data);
        } catch (error) { console.error(error); }
      });
    }

    function limpiarHTML(html) {
      const contenedor = document.createElement("div");
      contenedor.innerHTML = html || "";
      const permitidas = ["B", "STRONG", "U", "S", "DEL", "I", "EM", "BR", "DIV", "P", "MARK", "SPAN", "FONT"];
      contenedor.querySelectorAll("*").forEach(elemento => {
        if (!permitidas.includes(elemento.tagName)) {
          const fragmento = document.createDocumentFragment();
          while (elemento.firstChild) fragmento.appendChild(elemento.firstChild);
          elemento.replaceWith(fragmento);
          return;
        }
        Array.from(elemento.attributes).forEach(atributo => {
          if (atributo.name !== "style") {
            elemento.removeAttribute(atributo.name);
            return;
          }
          const alineacion = elemento.style.textAlign;
          const fondo = elemento.style.backgroundColor;
          elemento.removeAttribute("style");
          if (alineacion === "justify") elemento.style.textAlign = "justify";
          if (fondo) elemento.style.backgroundColor = fondo;
        });
      });
      return contenedor.innerHTML;
    }

    function mostrarProyeccion(data) {
      if (!data) return;

      if (data.type === "freeText") {
        reference.textContent = "Cita";
        text.className = "text quote";
        text.innerHTML = limpiarHTML(data.html || "");
        version.textContent = "";
        text.scrollTop = 0;
        return;
      }

      if (data.type === "verse-html") {
        reference.textContent = `${data.bookName} ${data.chapter}:${data.verse}`;
        text.className = "text";
        text.innerHTML = limpiarHTML(data.html || "");
        version.textContent = data.version || "";
        text.scrollTop = 0;
        return;
      }

      reference.textContent = `${data.bookName} ${data.chapter}:${data.verse}`;
      text.className = "text";
      text.textContent = data.text;
      version.textContent = data.version || "";
      text.scrollTop = 0;
    }

    async function pantallaCompleta() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) { console.error(error); }
    }

    fullscreenButton.addEventListener("click", pantallaCompleta);
    conectar();
  </script>
</body>
</html>
