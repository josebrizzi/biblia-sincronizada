<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Sincronizada — Predicador</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: Arial, sans-serif; background:#f4f1ea; color:#222; }
  header { background:#173f35; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; }
  header span { font-size:13px; opacity:.85; }
  .topbar { background:#fff; padding:10px 12px; display:flex; gap:10px; border-bottom:1px solid #e0ddd5; }
  .topbar select { flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  .search-row { display:flex; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid #e0ddd5; }
  #searchInput { flex:1; padding:11px 12px; border:2px solid #ccc; border-radius:10px; font-size:17px; }
  #searchInput:focus { border-color:#173f35; outline:none; }
  #searchButton { border:none; border-radius:10px; width:52px; background:#173f35; color:#fff; font-size:20px; cursor:pointer; }
  .search-info { display:none; padding:8px 12px; background:#eef4f1; color:#173f35; font-weight:bold; font-size:14px; justify-content:space-between; align-items:center; }
  .search-info button { background:none; border:none; color:#173f35; text-decoration:underline; font-weight:bold; cursor:pointer; }

  .preview { padding:10px 12px; display:none; flex-direction:column; gap:8px; }
  .pbox { border-radius:10px; padding:10px 12px; cursor:pointer; }
  .pbox .pref { font-weight:bold; font-size:14px; }
  .pbox .ptext { font-size:16px; line-height:1.4; margin-top:2px; }
  .pbox.prev { background:#e9e7e1; color:#555; }
  .pbox.prev::before { content:"◀ TOCÁ PARA VOLVER"; display:block; font-size:10px; color:#999; letter-spacing:.5px; }
  .pbox.next { background:#dcece5; color:#173f35; }
  .pbox.next::after { content:"TOCÁ PARA AVANZAR ▶"; display:block; font-size:10px; color:#5c8a7d; text-align:right; letter-spacing:.5px; }
  .pbox.cur { background:#fff; border:2px solid #173f35; cursor:default; }
  .pbox.cur .pref { color:#173f35; font-size:16px; }
  .pbox.cur .ptext { font-size:22px; font-weight:bold; line-height:1.45; }
  .pbox.hidden { display:none; }

  .tabs { display:flex; background:#fff; border-bottom:2px solid #e0ddd5; position:sticky; top:0; z-index:5; }
  .tab { flex:1; text-align:center; padding:12px 2px; font-weight:bold; font-size:13px; color:#888; cursor:pointer; border-bottom:3px solid transparent; }
  .tab.active { color:#173f35; border-bottom-color:#173f35; }
  .tab.disabled { color:#ccc; pointer-events:none; }

  main { max-width:900px; margin:0 auto; }
  .tabpage { display:none; padding:10px 12px 90px; }
  .tabpage.active { display:block; }

  .book-row { padding:16px 14px; border-bottom:1px solid #e5e5e5; font-size:21px; color:#173f35; cursor:pointer; background:#fff; }
  .book-row:hover { background:#f0f5f2; }

  .grid-num { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .numcell { background:#e3ece7; color:#173f35; font-weight:bold; font-size:20px; text-align:center; padding:16px 0; border-radius:6px; cursor:pointer; }
  .numcell:hover { background:#d3e2db; }
  .numcell.selected { background:#173f35; color:#fff; }

  .list-toggle { display:block; width:100%; margin-top:12px; padding:14px; border:none; border-radius:10px; background:#173f35; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; }

  .vlist { margin-top:12px; border:1px solid #ddd; border-radius:10px; overflow:hidden; }
  .verse { display:flex; gap:10px; padding:12px; border-bottom:1px solid #e8e8e8; cursor:pointer; background:#fff; }
  .verse:last-child { border-bottom:none; }
  .verse:hover { background:#f4f7f5; }
  .verse.selected { background:#c8e6c9; }
  .vnum { min-width:30px; font-weight:bold; color:#173f35; font-size:18px; }
  .vtext { font-size:19px; line-height:1.5; }
  .vpart { font-size:12px; color:#888; margin-top:2px; }
  .vtext mark { background:#ffe27a; padding:0 2px; border-radius:3px; }

  .actions { display:flex; gap:10px; padding:12px; position:fixed; bottom:0; left:0; right:0; max-width:900px; margin:0 auto; background:rgba(244,241,234,0.97); border-top:1px solid #ddd; z-index:6; }
  .actions button { border:none; border-radius:9px; padding:12px 18px; font-size:16px; font-weight:bold; cursor:pointer; }
  #editVerseButton { background:#b45309; color:#fff; flex:1; }
  #editVerseButton:disabled { background:#ccc; }
  #salirEdicion { background:#7a5c00; color:#fff; display:none; }
  #clearButton { background:#ddd; color:#222; }

  .editor-panel { display:none; padding:0 12px 8px; }
  .editor-panel.visible { display:block; }
  .editor-panel label { font-weight:bold; color:#b45309; font-size:14px; display:block; margin-bottom:6px; }
  .quote-editor { background:#fff; border:1px solid #ccc; border-radius:9px; padding:12px; font-size:19px; line-height:1.9; outline:none; min-height:120px; max-height:280px; overflow-y:auto; user-select:none; }
  .palabra { cursor:pointer; border-radius:3px; }
  .palabra.resaltada { background:#ffff00; }

  .status { padding:6px 12px 4px; font-size:13px; color:#666; }
</style>
</head>
<body>
<header>
  <h1>📖 Biblia Sincronizada</h1>
  <span>v8 · <span id="connectedCount">0</span> conect.</span>
</header>

<div class="topbar">
  <select id="version"><option value="">Versión…</option></select>
</div>

<div class="search-row">
  <input id="searchInput" type="search" placeholder="🔍 Buscar palabra o frase…" autocomplete="off">
  <button id="searchButton">🔍</button>
</div>
<div class="search-info" id="searchInfo">
  <span id="searchInfoTexto"></span>
  <button id="clearSearchButton">✕ Volver</button>
</div>

<div class="preview" id="preview">
  <div class="pbox prev hidden" id="prevBox"></div>
  <div class="pbox cur" id="curBox"><div class="pref" id="curRef"></div><div class="ptext" id="curText"></div></div>
  <div class="pbox next hidden" id="nextBox"></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="libro">LIBRO</div>
  <div class="tab disabled" data-tab="capitulo">CAPÍTULO</div>
  <div class="tab disabled" data-tab="versiculo">VERSÍCULO</div>
  <div class="tab disabled" data-tab="busqueda">BUSCAR</div>
</div>

<main>
  <section class="tabpage active" id="page-libro">
    <div id="bookList"><div class="book-row" style="color:#999;">Elija una versión…</div></div>
  </section>
  <section class="tabpage" id="page-capitulo">
    <div class="grid-num" id="chapterGrid"></div>
  </section>
  <section class="tabpage" id="page-versiculo">
    <div class="grid-num" id="verseGrid"></div>
    <button class="list-toggle" id="listToggle">📄 Ver lista de versículos</button>
    <div class="vlist" id="verseList" style="display:none;"></div>
  </section>
  <section class="tabpage" id="page-busqueda">
    <div class="vlist" id="resultList" style="margin-top:0;"></div>
  </section>
</main>

<div class="editor-panel" id="panelResaltar">
  <label>🖍️ TOCÁ LAS PALABRAS A RESALTAR — se proyectan al instante</label>
  <div id="freeText" class="quote-editor"></div>
</div>

<div class="actions">
  <button id="editVerseButton" disabled>🖍️ Resaltar palabras</button>
  <button id="salirEdicion">✕ Salir resaltado</button>
  <button id="clearButton">Limpiar</button>
</div>

<div class="status">WebSocket: <span id="wsStatus">Conectando...</span></div>

<script>
  const versionSelect = document.getElementById("version");
  const bookList = document.getElementById("bookList");
  const chapterGrid = document.getElementById("chapterGrid");
  const verseGrid = document.getElementById("verseGrid");
  const verseList = document.getElementById("verseList");
  const listToggle = document.getElementById("listToggle");
  const resultList = document.getElementById("resultList");
  const preview = document.getElementById("preview");
  const prevBox = document.getElementById("prevBox");
  const nextBox = document.getElementById("nextBox");
  const curRef = document.getElementById("curRef");
  const curText = document.getElementById("curText");
  const searchInput = document.getElementById("searchInput");
  const searchButton = document.getElementById("searchButton");
  const searchInfo = document.getElementById("searchInfo");
  const searchInfoTexto = document.getElementById("searchInfoTexto");
  const clearSearchButton = document.getElementById("clearSearchButton");
  const editVerseButton = document.getElementById("editVerseButton");
  const salirEdicion = document.getElementById("salirEdicion");
  const clearButton = document.getElementById("clearButton");
  const panelResaltar = document.getElementById("panelResaltar");
  const freeText = document.getElementById("freeText");
  const wsStatus = document.getElementById("wsStatus");
  const connectedCount = document.getElementById("connectedCount");

  const UMBRAL_PARTES = 240;
  let ws = null;
  let currentVerses = [];
  let playlist = [];          // cada item = una parte proyectable
  let currentItem = -1;
  let selectedBookName = "";
  let currentBookNumber = null;
  let currentChapter = null;
  let ultimoTab = "libro";
  let modoResaltar = false;
  let qBusqueda = "";

  function escapeHtml(t) {
    return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function resaltarQ(texto, q) {
    const t = escapeHtml(texto);
    if (!q) return t;
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    return t.replace(re, "<mark>$1</mark>");
  }

  // ---------- WebSocket ----------
  function connectWebSocket() {
    const p = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${p}//${location.host}`);
    ws.addEventListener("open", () => { wsStatus.textContent = "Conectado"; });
    ws.addEventListener("close", () => { wsStatus.textContent = "Desconectado"; setTimeout(connectWebSocket, 2000); });
    ws.addEventListener("error", () => { wsStatus.textContent = "Error"; });
    ws.addEventListener("message", (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === "connected") { connectedCount.textContent = data.count; return; }
        if (data.type === "projection") {
          const d = data.data || {};
          // Si avanzaron partes desde la pantalla (clic/flechas), sincronizo la vista previa
          if (d.type === "parts-info" && d.count > 1 && currentItem >= 0) {
            const base = currentItem - playlist[currentItem].partIndex;
            const nuevo = base + (d.current - 1);
            if (nuevo >= 0 && nuevo < playlist.length) {
              currentItem = nuevo;
              actualizarPreview(); marcarSeleccion();
            }
          }
        }
      } catch(e) {}
    });
  }

  // ---------- Partes ----------
  function wordsDe(texto) {
    return String(texto).replace(/\s+/g," ").trim().split(" ").filter(Boolean).map(t => ({t:t, h:0}));
  }
  function partirPalabras(words) {
    const total = words.reduce((a,w)=>a+w.t.length+1,0);
    if (total <= UMBRAL_PARTES || words.length < 2) return [[0, words.length]];
    let acc=0, corte=Math.floor(words.length/2);
    for (let i=0;i<words.length;i++){ acc+=words[i].t.length+1; if (acc>=total/2){corte=i;break;} }
    const ventana = Math.max(3, Math.floor(words.length*0.12));
    for (let d=0; d<=ventana; d++){
      const izq=corte-d, der=corte+d;
      if (izq>0 && /[.,;:?!]$/.test(words[izq-1].t)) { corte=izq; break; }
      if (der<words.length-1 && /[.,;:?!]$/.test(words[der-1].t)) { corte=der; break; }
    }
    corte=Math.max(1,Math.min(corte,words.length-1));
    return [[0,corte],[corte,words.length]];
  }
  function textoParte(it) {
    const [a,b] = it.parts[it.partIndex];
    let s = it.words.slice(a,b).map(w=>w.t).join(" ");
    if (it.partIndex > 0) s = "… " + s;
    if (it.partIndex < it.totalParts-1) s = s + " …";
    return s;
  }

  // ---------- Proyección ----------
  function proyectarItem(i) {
    if (i < 0 || i >= playlist.length) return;
    currentItem = i;
    const it = playlist[i];
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: "project",
        reference: it.referencia,
        data: {
          type: "verse",
          words: it.words,
          parts: it.parts,
          part: it.partIndex,
          version: it.version, bookName: it.bookName,
          chapter: it.chapter, verse: it.verse
        }
      }));
    }
    actualizarPreview(); marcarSeleccion();
  }

  function actualizarPreview() {
    if (currentItem < 0) { preview.style.display = "none"; return; }
    preview.style.display = "flex";
    const it = playlist[currentItem];
    const ref = it.referencia + (it.totalParts>1 ? ` (parte ${it.partIndex+1})` : "");
    curRef.textContent = ref + " — " + it.version;
    curText.textContent = textoParte(it);
    if (currentItem > 0) {
      const p = playlist[currentItem-1];
      prevBox.classList.remove("hidden");
      prevBox.innerHTML = `<div class="pref">${escapeHtml(p.referencia)}</div><div class="ptext">${escapeHtml(textoParte(p))}</div>`;
    } else prevBox.classList.add("hidden");
    if (currentItem < playlist.length-1) {
      const n = playlist[currentItem+1];
      nextBox.classList.remove("hidden");
      nextBox.innerHTML = `<div class="pref">${escapeHtml(n.referencia)}</div><div class="ptext">${escapeHtml(textoParte(n))}</div>`;
    } else nextBox.classList.add("hidden");
  }
  prevBox.addEventListener("click", () => proyectarItem(currentItem-1));
  nextBox.addEventListener("click", () => proyectarItem(currentItem+1));

  // ---------- Listas ----------
  function pintarLista(container, marcarQ) {
    container.innerHTML = "";
    playlist.forEach((it, i) => {
      const div = document.createElement("div");
      div.className = "verse";
      div.dataset.i = i;
      div.innerHTML = `
        <div class="vnum">${it.verse}</div>
        <div>
          <div class="vtext">${resaltarQ(textoParte(it), marcarQ)}</div>
          ${it.totalParts>1 ? `<div class="vpart">parte ${it.partIndex+1} de ${it.totalParts}</div>` : ""}
        </div>`;
      div.addEventListener("click", () => proyectarItem(i));
      container.appendChild(div);
    });
  }

  function marcarSeleccion() {
    document.querySelectorAll(".verse").forEach(el => {
      el.classList.toggle("selected", Number(el.dataset.i) === currentItem);
    });
    document.querySelectorAll("#verseGrid .numcell").forEach(el => {
      el.classList.toggle("selected", currentItem >= 0 && Number(el.dataset.v) === playlist[currentItem].verse);
    });
    const sel = document.querySelector(".verse.selected");
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }

  // ---------- Tabs ----------
  function activarTab(name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
    document.querySelectorAll(".tabpage").forEach(p => p.classList.toggle("active", p.id === "page-" + name));
    if (name !== "busqueda") ultimoTab = name;
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => activarTab(t.dataset.tab)));
  function tabEstado(name, habilitado) {
    document.querySelector(`.tab[data-tab="${name}"]`).classList.toggle("disabled", !habilitado);
  }

  // ---------- Navegación LIBRO → CAPÍTULO → VERSÍCULO ----------
  async function cargarVersiones() {
    const r = await fetch("./api/versions");
    const vs = await r.json();
    versionSelect.innerHTML = '<option value="">Versión…</option>';
    vs.forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      versionSelect.appendChild(o);
    });
  }

  async function cargarLibros() {
    bookList.innerHTML = '<div class="book-row" style="color:#999;">Cargando…</div>';
    const r = await fetch("./api/books?version=" + encodeURIComponent(versionSelect.value));
    const books = await r.json();
    bookList.innerHTML = "";
    books.forEach(b => {
      const d = document.createElement("div");
      d.className = "book-row";
      d.textContent = b.book_name;
      d.addEventListener("click", () => elegirLibro(b));
      bookList.appendChild(d);
    });
  }

  async function elegirLibro(b) {
    selectedBookName = b.book_name;
    currentBookNumber = b.book_number;
    tabEstado("capitulo", true);
    activarTab("capitulo");
    chapterGrid.innerHTML = '<div style="color:#999;padding:10px;">Cargando…</div>';
    const r = await fetch(`./api/chapters?version=${encodeURIComponent(versionSelect.value)}&book=${b.book_number}`);
    const caps = await r.json();
    chapterGrid.innerHTML = "";
    caps.forEach(c => {
      const cell = document.createElement("div");
      cell.className = "numcell";
      cell.textContent = c;
      cell.addEventListener("click", () => elegirCapitulo(c, cell));
      chapterGrid.appendChild(cell);
    });
  }

  async function elegirCapitulo(c, cell) {
    currentChapter = c;
    chapterGrid.querySelectorAll(".numcell").forEach(e => e.classList.remove("selected"));
    cell.classList.add("selected");
    const r = await fetch(`./api/verses?version=${encodeURIComponent(versionSelect.value)}&book=${currentBookNumber}&chapter=${c}`);
    currentVerses = await r.json();

    // Construye la lista de partes (versículos largos = 2 partes, como Holyrics)
    playlist = [];
    currentVerses.forEach(v => {
      const words = wordsDe(v.text);
      const partes = partirPalabras(words);
      partes.forEach((rg, pi) => {
        playlist.push({
          referencia: `${selectedBookName} ${c}:${v.verse}`,
          version: versionSelect.value,
          bookName: selectedBookName, bookNumber: currentBookNumber,
          chapter: c, verse: v.verse,
          words, parts: partes, partIndex: pi, totalParts: partes.length
        });
      });
    });

    // Cuadrícula de versículos
    const maxV = Math.max(...currentVerses.map(v => v.verse));
    verseGrid.innerHTML = "";
    for (let n = 1; n <= maxV; n++) {
      const cell = document.createElement("div");
      cell.className = "numcell";
      cell.dataset.v = n;
      cell.textContent = n;
      cell.addEventListener("click", () => {
        const idx = playlist.findIndex(it => it.verse === n);
        if (idx < 0) return;
        proyectarItem(idx);
        verLista();
      });
      verseGrid.appendChild(cell);
    }
    pintarLista(verseList, "");
    tabEstado("versiculo", true);
    activarTab("versiculo");
  }

  function verLista() {
    verseList.style.display = "block";
    verseGrid.style.display = "none";
    listToggle.textContent = "🔲 Ver cuadrícula";
    marcarSeleccion();
  }
  function verGrilla() {
    verseList.style.display = "none";
    verseGrid.style.display = "grid";
    listToggle.textContent = "📄 Ver lista de versículos";
  }
  listToggle.addEventListener("click", () => {
    (verseList.style.display === "none") ? verLista() : verGrilla();
  });

  // ---------- Buscador ----------
  async function hacerBusqueda() {
    const q = searchInput.value.trim();
    if (q.length < 2) return;
    if (!versionSelect.value) {
      if (versionSelect.options.length > 1) versionSelect.selectedIndex = 1;
      else return;
      await cargarLibros();
    }
    resultList.innerHTML = '<div class="verse" style="color:#999;">Buscando…</div>';
    const r = await fetch(`./api/search?q=${encodeURIComponent(q)}&version=${encodeURIComponent(versionSelect.value)}`);
    const res = await r.json();

    playlist = []; qBusqueda = q;
    res.forEach(item => {
      const words = wordsDe(item.text);
      const partes = partirPalabras(words);
      partes.forEach((rg, pi) => {
        playlist.push({
          referencia: `${item.book_name} ${item.chapter}:${item.verse}`,
          version: versionSelect.value,
          bookName: item.book_name, bookNumber: item.book_number,
          chapter: item.chapter, verse: item.verse,
          words, parts: partes, partIndex: pi, totalParts: partes.length
        });
      });
    });

    searchInfo.style.display = "flex";
    searchInfoTexto.textContent = `“${q}”: ${res.length} versículo(s)`;
    tabEstado("busqueda", true);
    activarTab("busqueda");
    pintarLista(resultList, q);
  }
  function salirBusqueda() {
    searchInfo.style.display = "none";
    searchInput.value = "";
    qBusqueda = "";
    tabEstado("busqueda", false);
    activarTab(ultimoTab);
  }
  searchButton.addEventListener("click", hacerBusqueda);
  searchInput.addEventListener("keydown", e => { if (e.key === "Enter") hacerBusqueda(); });
  clearSearchButton.addEventListener("click", salirBusqueda);

  // ---------- Resaltar ----------
  editVerseButton.addEventListener("click", () => {
    if (currentItem < 0) return;
    const it = playlist[currentItem];
    freeText.innerHTML = it.words.map(w => `<span class="palabra">${escapeHtml(w.t)}</span>`).join(" ");
    modoResaltar = true;
    panelResaltar.classList.add("visible");
    salirEdicion.style.display = "";
    freeText.scrollTop = 0;
  });
  freeText.addEventListener("click", e => {
    if (!e.target.classList.contains("palabra")) return;
    e.target.classList.toggle("resaltada");
    if (!modoResaltar || currentItem < 0) return;
    const it = playlist[currentItem];
    it.words = Array.from(freeText.querySelectorAll(".palabra")).map(s => ({ t: s.textContent, h: s.classList.contains("resaltada") ? 1 : 0 }));
    proyectarItem(currentItem);
  });
  salirEdicion.addEventListener("click", () => {
    modoResaltar = false;
    freeText.innerHTML = "";
    panelResaltar.classList.remove("visible");
    salirEdicion.style.display = "none";
    proyectarItem(currentItem); // vuelve al versículo limpio
  });

  // ---------- Limpiar todo ----------
  clearButton.addEventListener("click", () => {
    playlist = []; currentItem = -1; currentVerses = [];
    selectedBookName = ""; currentBookNumber = null; currentChapter = null;
    modoResaltar = false; freeText.innerHTML = "";
    panelResaltar.classList.remove("visible"); salirEdicion.style.display = "none";
    preview.style.display = "none";
    editVerseButton.disabled = true;
    bookList.innerHTML = '<div class="book-row" style="color:#999;">Elija una versión…</div>';
    chapterGrid.innerHTML = ""; verseGrid.innerHTML = ""; verseList.innerHTML = ""; resultList.innerHTML = "";
    searchInput.value = ""; searchInfo.style.display = "none";
    tabEstado("capitulo", false); tabEstado("versiculo", false); tabEstado("busqueda", false);
    activarTab("libro");
  });

  versionSelect.addEventListener("change", () => {
    clearButton.click();
    if (versionSelect.value) cargarLibros();
  });

  // El botón Resaltar se habilita cuando hay algo proyectado
  const obs = new MutationObserver(() => { editVerseButton.disabled = (currentItem < 0); });
  obs.observe(document.getElementById("preview"), { attributes: true });

  cargarVersiones();
  connectWebSocket();
