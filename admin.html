<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Sincronizada — Predicador</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f4f1ea; color: #222; }
  header { background: #173f35; color: white; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 5px 0 0; opacity: 0.85; }
  main { max-width: 1100px; margin: 25px auto; padding: 0 18px; }
  .panel { background: white; border-radius: 14px; padding: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  label { display: block; font-weight: bold; margin-bottom: 6px; }
  select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: white; }
  .reference { margin-top: 18px; font-size: 20px; font-weight: bold; }
  .verses { margin-top: 20px; max-height: 430px; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; }
  .verse { display: flex; gap: 12px; padding: 13px; border-bottom: 1px solid #eee; cursor: pointer; }
  .verse:last-child { border-bottom: none; }
  .verse:hover { background: #f4f7f5; }
  .verse.selected { background: #dcece5; outline: 2px solid #173f35; }
  .verse-number { min-width: 32px; font-weight: bold; color: #173f35; }
  .verse-text { line-height: 1.5; }
  .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button { border: none; border-radius: 9px; padding: 14px 22px; font-size: 17px; font-weight: bold; cursor: pointer; }
  #editVerseButton { background: #b45309; color: white; flex: 1; }
  #editVerseButton:disabled { background: #ccc; cursor: not-allowed; }
  #partButton { background: #173f35; color: white; display: none; }
  #clearButton { background: #ddd; color: #222; }
  .free-text-panel { margin-top: 20px; padding: 18px; border: 1px solid #ddd; border-radius: 12px; background: #fafafa; display: none; }
  .free-text-panel.visible { display: block; }
  .free-text-panel > label { display: block; margin-bottom: 8px; font-weight: bold; color: #b45309; }
  .quote-editor {
    width: 100%; min-height: 140px; max-height: 340px; overflow-y: auto;
    box-sizing: border-box; padding: 14px; border: 1px solid #ccc; border-radius: 9px;
    background: white; font-family: Arial, sans-serif;
    font-size: 19px; line-height: 1.9; outline: none; user-select: none;
  }
  .palabra { cursor: pointer; border-radius: 3px; }
  .palabra.resaltada { background-color: #ffff00; }
  .modo-edicion {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #fff7e0; border: 1px solid #e6c96a; color: #7a5c00;
    font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .modo-edicion button { background: none; color: #7a5c00; padding: 6px 10px; font-size: 14px; text-decoration: underline; }
  .status { margin-top: 15px; padding: 10px; border-radius: 8px; background: #f1f1f1; }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <h1>📖 Biblia Sincronizada</h1>
  <p>Panel del predicador</p>
</header>
<main>
  <section class="panel">
    <div class="grid">
      <div>
        <label for="version">Versión</label>
        <select id="version"><option value="">Cargando...</option></select>
      </div>
      <div>
        <label for="book">Libro</label>
        <select id="book" disabled><option value="">Seleccione una versión</option></select>
      </div>
      <div>
        <label for="chapter">Capítulo</label>
        <select id="chapter" disabled><option value="">Seleccione un libro</option></select>
      </div>
    </div>

    <div class="reference" id="reference">Seleccione una referencia</div>

    <div class="verses" id="verses">
      <div style="padding:20px; color:#777;">Seleccione versión, libro y capítulo.</div>
    </div>

    <div class="actions">
      <button id="editVerseButton" disabled>🖍️ Resaltar palabras</button>
      <button id="partButton">▶️ Parte 2</button>
      <button id="clearButton">Limpiar</button>
    </div>

    <div class="free-text-panel" id="panelResaltar">
      <label>🖍️ TOCÁ LAS PALABRAS QUE QUERÉS RESALTAR — se proyectan al instante</label>
      <div id="freeText" class="quote-editor"></div>
      <div class="modo-edicion">
        <span id="modoTexto"></span>
        <button type="button" id="salirEdicion">✕ Terminar y volver al versículo limpio</button>
      </div>
    </div>

    <div class="status">
      Estado WebSocket: <span id="wsStatus">Conectando...</span>
      | Conectados: <span id="connectedCount">0</span>
    </div>
  </section>
</main>

<script>
  const versionSelect = document.getElementById("version");
  const bookSelect = document.getElementById("book");
  const chapterSelect = document.getElementById("chapter");
  const versesContainer = document.getElementById("verses");
  const referenceElement = document.getElementById("reference");
  const clearButton = document.getElementById("clearButton");
  const editVerseButton = document.getElementById("editVerseButton");
  const partButton = document.getElementById("partButton");
  const freeText = document.getElementById("freeText");
  const panelResaltar = document.getElementById("panelResaltar");
  const modoTexto = document.getElementById("modoTexto");
  const salirEdicion = document.getElementById("salirEdicion");
  const wsStatus = document.getElementById("wsStatus");
  const connectedCount = document.getElementById("connectedCount");

  let ws = null;
  let currentVerses = [];
  let selectedVerse = null;
  let selectedBookName = "";
  let versiculoEnEdicion = null;
  let parteRemota = 1;

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function connectWebSocket() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${protocol}//${location.host}`);
    ws.addEventListener("open", () => { wsStatus.textContent = "Conectado"; });
    ws.addEventListener("close", () => { wsStatus.textContent = "Desconectado"; setTimeout(connectWebSocket, 2000); });
    ws.addEventListener("error", () => { wsStatus.textContent = "Error"; });
    ws.addEventListener("message", (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === "connected") {
          connectedCount.textContent = data.count;
        } else if (data.type === "projection") {
          const d = data.data || {};
          if (d.type === "parts-info") {
            // La pantalla informa si el versículo se cortó en 2 partes
            if (d.count > 1) {
              parteRemota = d.current || 1;
              partButton.style.display = "";
              partButton.textContent = parteRemota === 1 ? "▶️  Parte 2" : "◀️  Parte 1";
            } else {
              partButton.style.display = "none";
            }
          } else if (d.type === "verse" || d.type === "freeText") {
            partButton.style.display = "none";
          }
        }
      } catch (error) { console.error(error); }
    });
  }

  async function cargarVersiones() {
    const response = await fetch("./api/versions");
    const versions = await response.json();
    versionSelect.innerHTML = '<option value="">Seleccione una versión</option>';
    versions.forEach(version => {
      const option = document.createElement("option");
      option.value = version;
      option.textContent = version;
      versionSelect.appendChild(option);
    });
  }

  async function cargarLibros() {
    const version = versionSelect.value;
    bookSelect.innerHTML = '<option value="">Cargando...</option>';
    bookSelect.disabled = true;
    chapterSelect.innerHTML = '<option value="">Seleccione un libro</option>';
    chapterSelect.disabled = true;
    versesContainer.innerHTML = '<div style="padding:20px;color:#777;">Seleccione un capítulo.</div>';
    if (!version) return;
    const response = await fetch("./api/books?version=" + encodeURIComponent(version));
    const books = await response.json();
    bookSelect.innerHTML = '<option value="">Seleccione un libro</option>';
    books.forEach(book => {
      const option = document.createElement("option");
      option.value = book.book_number;
      option.textContent = book.book_name;
      option.dataset.name = book.book_name;
      bookSelect.appendChild(option);
    });
    bookSelect.disabled = false;
  }

  async function cargarCapitulos() {
    const version = versionSelect.value;
    const book = bookSelect.value;
    selectedBookName = bookSelect.options[bookSelect.selectedIndex]?.dataset.name || "";
    chapterSelect.innerHTML = '<option value="">Cargando...</option>';
    chapterSelect.disabled = true;
    if (!book) return;
    const response = await fetch(`./api/chapters?version=${encodeURIComponent(version)}&book=${book}`);
    const chapters = await response.json();
    chapterSelect.innerHTML = '<option value="">Seleccione un capítulo</option>';
    chapters.forEach(chapter => {
      const option = document.createElement("option");
      option.value = chapter;
      option.textContent = chapter;
      chapterSelect.appendChild(option);
    });
    chapterSelect.disabled = false;
  }

  async function cargarVersiculos() {
    const version = versionSelect.value;
    const book = bookSelect.value;
    const chapter = chapterSelect.value;
    versesContainer.innerHTML = '<div style="padding:20px;color:#777;">Cargando...</div>';
    currentVerses = [];
    selectedVerse = null;
    editVerseButton.disabled = true;
    salirModoPalabras(false);
    if (!chapter) return;
    const response = await fetch(`./api/verses?version=${encodeURIComponent(version)}&book=${book}&chapter=${chapter}`);
    currentVerses = await response.json();
    mostrarVersiculos();
  }

  function mostrarVersiculos() {
    versesContainer.innerHTML = "";
    currentVerses.forEach(item => {
      const div = document.createElement("div");
      div.className = "verse";
      div.dataset.verse = item.verse;
      div.innerHTML = `
        <div class="verse-number">${item.verse}</div>
        <div class="verse-text">${escapeHtml(item.text)}</div>
      `;
      div.addEventListener("click", () => {
        document.querySelectorAll(".verse").forEach(element => element.classList.remove("selected"));
        div.classList.add("selected");
        selectedVerse = item.verse;
        editVerseButton.disabled = false;
        salirModoPalabras(false); // limpia el resaltado anterior
        actualizarReferencia();
        proyectar();
      });
      versesContainer.appendChild(div);
    });
  }

  function actualizarReferencia() {
    if (!versionSelect.value || !selectedBookName || !chapterSelect.value || !selectedVerse) {
      referenceElement.textContent = "Seleccione una referencia";
      return;
    }
    referenceElement.textContent = `${selectedBookName} ${chapterSelect.value}:${selectedVerse} — ${versionSelect.value}`;
  }

  // Proyecta el versículo limpio (palabras sin resaltar)
  function proyectar() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !selectedVerse) return;
    const verse = currentVerses.find(item => Number(item.verse) === Number(selectedVerse));
    if (!verse) return;
    const words = String(verse.text).replace(/\s+/g, " ").trim().split(" ")
      .filter(Boolean).map(t => ({ t: t, h: 0 }));
    ws.send(JSON.stringify({
      type: "project",
      reference: `${selectedBookName} ${chapterSelect.value}:${verse.verse}`,
      data: {
        type: "verse",
        words: words,
        version: versionSelect.value,
        bookName: selectedBookName,
        chapter: Number(chapterSelect.value),
        verse: Number(verse.verse)
      }
    }));
  }

  // ---- MODO RESALTAR: tocar palabra = resaltar + proyectar al instante ----
  function activarModoPalabras(textoPlano, info) {
    const palabras = String(textoPlano).replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
    freeText.innerHTML = palabras.map(p => `<span class="palabra">${escapeHtml(p)}</span>`).join(" ");
    versiculoEnEdicion = info || null;
    modoTexto.textContent = "Resaltando: " + info.referencia;
    panelResaltar.classList.add("visible");
    freeText.scrollTop = 0;
  }

  function salirModoPalabras(reproyectarLimpio) {
    freeText.innerHTML = "";
    versiculoEnEdicion = null;
    panelResaltar.classList.remove("visible");
    if (reproyectarLimpio && selectedVerse) proyectar();
  }

  freeText.addEventListener("click", (e) => {
    if (!e.target.classList || !e.target.classList.contains("palabra")) return;
    e.target.classList.toggle("resaltada");
    autoProyectar();
  });

  function autoProyectar() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !versiculoEnEdicion) return;
    const words = Array.from(freeText.querySelectorAll("span.palabra"))
      .map(s => ({ t: s.textContent, h: s.classList.contains("resaltada") ? 1 : 0 }));
    if (!words.length) return;
    ws.send(JSON.stringify({
      type: "project",
      reference: versiculoEnEdicion.referencia,
      data: {
        type: "verse",
        words: words,
        version: versiculoEnEdicion.version,
        bookName: versiculoEnEdicion.bookName,
        chapter: versiculoEnEdicion.chapter,
        verse: versiculoEnEdicion.verse
      }
    }));
  }

  editVerseButton.addEventListener("click", () => {
    const verse = currentVerses.find(item => Number(item.verse) === Number(selectedVerse));
    if (!verse) return;
    activarModoPalabras(verse.text, {
      referencia: `${selectedBookName} ${chapterSelect.value}:${verse.verse}`,
      bookName: selectedBookName,
      chapter: Number(chapterSelect.value),
      verse: Number(verse.verse),
      version: versionSelect.value
    });
  });

  salirEdicion.addEventListener("click", () => salirModoPalabras(true));

  // Botón Parte 1 / Parte 2 (aparece solo si el versículo se cortó)
  partButton.addEventListener("click", () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type: "project",
      reference: "",
      data: { type: "goto-part", part: parteRemota === 1 ? 2 : 1 }
    }));
  });

  function limpiar() {
    versionSelect.value = "";
    bookSelect.innerHTML = '<option value="">Seleccione una versión</option>';
    bookSelect.disabled = true;
    chapterSelect.innerHTML = '<option value="">Seleccione un libro</option>';
    chapterSelect.disabled = true;
    versesContainer.innerHTML = '<div style="padding:20px;color:#777;">Seleccione versión, libro y capítulo.</div>';
    referenceElement.textContent = "Seleccione una referencia";
    selectedVerse = null;
    currentVerses = [];
    editVerseButton.disabled = true;
    salirModoPalabras(false);
  }

  versionSelect.addEventListener("change", cargarLibros);
  bookSelect.addEventListener("change", cargarCapitulos);
  chapterSelect.addEventListener("change", cargarVersiculos);
  clearButton.addEventListener("click", limpiar);

  cargarVersiones();
  connectWebSocket();
</script>
</body>
</html>
